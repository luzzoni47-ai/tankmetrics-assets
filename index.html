<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tank Metrics — Reels</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:30px;
       padding:26px 14px 60px;background:linear-gradient(160deg,#0A0A0E,#020204);
       font-family:'Segoe UI',Helvetica Neue,Arial,sans-serif;color:#E7E9EF}
  h1{font-size:14px;letter-spacing:3px;color:#FAB802;margin:0;text-align:center}
  .grid{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;max-width:1060px}
  .card{width:330px;background:#0E0F14;border:1px solid #23242F;border-radius:18px;padding:12px;
        box-shadow:0 16px 44px rgba(0,0,0,.5)}
  video{width:100%;display:block;border-radius:12px;background:#000;cursor:pointer}
  .cap{margin-top:12px;position:relative}
  textarea{width:100%;height:150px;resize:none;border:1px solid #1C1D26;border-radius:12px;
           background:#0B0C11;color:#C9CBD6;padding:12px 46px 12px 12px;outline:none;
           font-family:inherit;font-size:12.5px;line-height:1.55}
  .copy{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;justify-content:center;
        width:34px;height:34px;cursor:pointer;border:none;border-radius:9px;
        background:linear-gradient(135deg,#1678FD,#000E9B);color:#fff}
  .copy.copied{background:linear-gradient(135deg,#21A542,#1678FD)}
</style>
</head>
<body>
  <h1>TANK METRICS — REELS</h1>
  <div class="grid" id="grid"></div>
<script>
const REELS=[
 {file:"tankmetrics-reel23-music.mp4",thumb:"tankmetrics-reel23-thumb.png",
  cap:`1750 crore ev funding


#reels #foryou #trending #viral #explore #explorepage #bangalore #startup #business #india


simple energy, ev, funding, bangalore, bengaluru, startup, crore, series c, valuation, founder, money, india


content: showing simple energy's 1750 crore series c round like this`},
 {file:"tankmetrics-reel24-music.mp4",thumb:"tankmetrics-reel24-thumb.png",
  cap:`startup funding slowdown


#reels #foryou #trending #viral #explore #explorepage #startup #funding #business #india


funding, startup, deals, investors, unit economics, burn rate, runway, valuation, margin, crore, money, india


content: showing why deals fell 13% and investors fell 24% this quarter like this`},
 {file:"tankmetrics-reel25-music.mp4",thumb:"tankmetrics-reel25-thumb.png",
  cap:`bengaluru ai chip funding


#reels #foryou #trending #viral #explore #explorepage #bengaluru #deeptech #startup #india


sima.ai, ai chips, deeptech, funding, bengaluru, bangalore, startup, series c, ml, valuation, money, india


content: showing 150 million dollars into bengaluru ai chips like this`},
 {file:"tankmetrics-reel26-music.mp4",thumb:"tankmetrics-reel26-thumb.png",
  cap:`gst on upi from october


#reels #foryou #trending #viral #explore #explorepage #gst #msme #business #india


gst, upi, merchant, margin, pricing, small business, msme, tax, profit, founder, money, india


content: showing how 18% gst on upi changes merchant margins like this`},
 {file:"tankmetrics-reel27-music.mp4",thumb:"tankmetrics-reel27-thumb.png",
  cap:`bengaluru funding map


#reels #foryou #trending #viral #explore #explorepage #bangalore #startup #funding #india


funding, bengaluru, bangalore, startup, india, 43 percent, valuation, founder, runway, burn rate, crore, money


content: showing how 43% of india's startup money went to one city like this`}
];
const grid=document.getElementById('grid');
REELS.forEach((o,i)=>{const el=document.createElement('div');el.className='card';
 el.innerHTML=`<video src="${o.file}" poster="${o.thumb}" playsinline controls preload="metadata"></video>
 <div class="cap"><textarea id="cap${i}" readonly>${o.cap}</textarea>
 <button class="copy" data-i="${i}" onclick="copyCap(${i})" title="Copy caption">
 <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"></rect><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path></svg>
 </button></div>`;
 grid.appendChild(el);});
async function copyCap(i){const ta=document.getElementById('cap'+i);const b=document.querySelector(`.copy[data-i="${i}"]`);
 try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.removeAttribute('readonly');ta.select();document.execCommand('copy');ta.setAttribute('readonly','');window.getSelection().removeAllRanges();}
 b.classList.add('copied');b.innerHTML='✓';setTimeout(()=>{b.classList.remove('copied');
 b.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"></rect><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path></svg>';},1500);}
</script>
</body>
</html>
